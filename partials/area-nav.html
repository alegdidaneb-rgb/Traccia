     perché il telefono non era un telefono.

     vede quante cose ci sono e dove sono, che è la metà del lavoro di un menu.

     senza JavaScript, apre una sezione che ha un indirizzo proprio, e il tasto
     indietro del browser fa quello che ci si aspetta.

     ce ne sono in tutto: solo dove c'è qualcosa da leggere o da fare compare.
