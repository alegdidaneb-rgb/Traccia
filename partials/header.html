  <header class="site-header">
  <div class="container">
    <nav class="nav" aria-label="Principale">
      <a class="brand" href="index.html">
        <span class="brand__mark" aria-hidden="true">T</span>
        <span>Traccia</span>
      </a>

      <button class="nav__toggle" aria-expanded="false" aria-controls="nav-panel" aria-label="Apri il menu">
        <span></span>
      </button>

      <!-- Il pannello: una scatola sola che contiene le voci **e** i pulsanti.
           Su desktop questa scatola sparisce (`display: contents`) e i due
           figli sono quello che erano: la lista a destra e i pulsanti dopo di
           lei, con la barra misurata che resta identica. Sotto la soglia
           dell'hamburger diventa la tendina, e allora «Accedi» e «Segnala un
           caso» stanno dentro, sotto le voci, invece di essere spenti: prima
           sparivano, e sul telefono non c'era nessun modo di accedere o di
           segnalare un caso senza scorrere la pagina. -->
      <div class="nav__panel" id="nav-panel">
      <ul class="nav__links" id="nav-links">
{{nav_links}}

        <li class="nav__lang" data-lang-switch>
          <!-- Cambio lingua: quattro pulsanti in fila, non un menu a tendina.
               Prima era un `<details>` con dentro una lista: due clic per
               cambiare lingua, un clic che non faceva niente quando si
               sceglieva la lingua in cui si era già, e su mobile il selettore
               finiva dentro l'hamburger — cioè invisibile a chi non sa dove
               cercarlo. Ora le quattro lingue si vedono sempre, con un clic
               solo e nessun clic a vuoto: la lingua corrente non è un link,
               è la pastiglia accesa.

               Le sigle sono l'unica forma visibile; il nome intero della
               lingua sta nel `title` e nell'`aria-label`. `hreflang` dice ai
               motori che quella è la stessa pagina in un'altra lingua. -->
          <div class="lang" role="group" aria-labelledby="lang-label" data-lang-group>
            <span class="sr-only" id="lang-label" data-lang-label>Lingua</span>
            <a class="lang__opt" href="/" hreflang="it" lang="it" data-lang="it"
               title="Italiano" aria-label="Italiano"><span aria-hidden="true">IT</span></a>
            <a class="lang__opt" href="/en/" hreflang="en" lang="en" data-lang="en"
               title="English" aria-label="English"><span aria-hidden="true">EN</span></a>
            <a class="lang__opt" href="/de/" hreflang="de" lang="de" data-lang="de"
               title="Deutsch" aria-label="Deutsch"><span aria-hidden="true">DE</span></a>
            <a class="lang__opt" href="/es/" hreflang="es" lang="es" data-lang="es"
               title="Español" aria-label="Español"><span aria-hidden="true">ES</span></a>
          </div>
        </li>
      </ul>

      <!-- I pulsanti stanno **fuori** dalla lista, non dentro: dentro, il
           pannello dell'hamburger li portava sotto e `position: fixed` li
           spingeva fuori dallo schermo. Fuori, sono un fratello della lista e
           della barra: in riga stanno a destra nel loro spazio, nel pannello
           si nascondono (il pannello ha «Accedi» e «Segnala un caso» come
           voci, e duplicarli lì era il motivo per cui si vedevano due volte).
           Ed è quello che rende la barra calcolabile: lista e pulsanti non si
           contendono più lo stesso pixel. -->
      <div class="nav__actions" data-auth-slot>
        <!-- visitatore -->
        <a class="btn btn--ghost btn--sm" href="login.html" data-auth-guest>Accedi</a>
        <a class="btn btn--sm" href="login.html#registrati" data-auth-guest>Segnala un caso</a>

        <!-- sessione attiva -->
        <div class="nav-user" data-auth-member hidden>
          <a class="nav-user__link" href="app.html">La mia pratica</a>
          <a class="nav-user__link nav-user__link--admin" href="admin.html" data-auth-admin hidden>Console admin</a>
          <span class="nav-user__id">
            <span class="nav-user__avatar" data-auth-initials aria-hidden="true"></span>
            <span class="nav-user__name" data-auth-user></span>
          </span>
          <button class="nav-user__exit" type="button" data-logout data-auth-member hidden>
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M6.5 2.5H3.5a1 1 0 00-1 1v9a1 1 0 001 1h3M10 11l3-3-3-3M13 8H6"
                    stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Esci
          </button>
        </div>
      </div>
      </div><!-- /nav__panel -->
    </nav>
  </div>
</header>
